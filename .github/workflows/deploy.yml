# Real-Currents Sovereign Storage Stack + IPFS Gateway
# Archives to Lighthouse/Filecoin for perpetual storage; deploys to Gandi with IPFS/IPNS gateway.
# Runs in parallel with GitHub Pages deploy (next.js.yml).
name: Deploy (Lighthouse Archive + Gandi IPFS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - real/currents

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Setup Node.js
        uses: ./.github/workflows/node.js

      - name: Setup Quarto
        uses: ./.github/workflows/quarto

      - name: Build with Next.js
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: out

  deploy-gandi-ipfs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Setup Node.js
        uses: ./.github/workflows/node.js

      - name: Setup Quarto
        uses: ./.github/workflows/quarto

      - name: Build Site (Quarto + Next.js)
        run: npm run build

      - name: Deploy to Gandi via Git
        env:
          GANDI_GIT_URL: ${{ secrets.GANDI_GIT_URL }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote add gandi $GANDI_GIT_URL 2>/dev/null || git remote set-url gandi $GANDI_GIT_URL
          git push gandi main --force

      - name: Install ipfs-car CLI
        run: npm install -g ipfs-car

      - name: Package Build as CAR
        run: ipfs-car pack out --output deploy.car

      - name: Upload CAR to IPFS (via Gandi Gateway)
        id: ipfs_upload
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          RESPONSE=$(curl -s -X POST https://www.real-currents.com/api/deploy \
            -H "x-api-key: $DEPLOY_SECRET" \
            -H "Content-Type: application/vnd.ipld.car" \
            --data-binary @deploy.car)

          echo "IPFS Response: $RESPONSE"
          CID=$(echo $RESPONSE | jq -r '.cid')
          echo "cid=$CID" >> $GITHUB_OUTPUT
          echo "Deployed to IPFS: $CID"

      - name: Update IPNS Pointer (xr-baseline-0)
        if: steps.ipfs_upload.outputs.cid != ''
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          CID: ${{ steps.ipfs_upload.outputs.cid }}
        run: |
          if [ -n "$CID" ] && [ -n "$DEPLOY_SECRET" ]; then
            curl -sS -X POST https://www.real-currents.com/api/ipns/publish \
              -H "x-api-key: $DEPLOY_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"key\": \"xr-baseline-0\", \"cid\": \"$CID\"}" || true
          fi
          echo "IPNS updated: xr-baseline-0 -> $CID"

      - name: Log Deployment
        run: |
          echo "✅ Live site updated at https://www.real-currents.com"
          echo "✅ IPFS snapshot: https://www.real-currents.com/ipfs/${{ steps.ipfs_upload.outputs.cid }}"
          echo "✅ IPNS stable link: https://www.real-currents.com/ipns/xr-baseline-0"

  archive-to-lighthouse:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: out

      - name: Setup Node.js
        uses: ./.github/workflows/node.js

      - name: Upload to Lighthouse (Perpetual Storage)
        id: lighthouse
        env:
          LIGHTHOUSE_API_KEY: ${{ secrets.LIGHTHOUSE_API_KEY }}
        run: |
          npm ci
          RESPONSE=$(LIGHTHOUSE_API_KEY="$LIGHTHOUSE_API_KEY" node scripts/lighthouse-upload.mjs ./out)
          HASH=$(echo "$RESPONSE" | node -e "const d=require('fs').readFileSync(0,'utf8'); try { const j=JSON.parse(d); console.log(j.hash||''); } catch(e) { console.log(''); }")
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Lighthouse CID: $HASH"

      - name: Log Lighthouse Archive
        run: |
          echo "✅ Archived to Lighthouse/Filecoin: ${{ steps.lighthouse.outputs.hash }}"
