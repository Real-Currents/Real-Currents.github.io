# Real-Currents Sovereign Storage Stack
# Archives every commit to Lighthouse/Filecoin for perpetual storage.
# Runs in parallel with GitHub Pages deploy (next.js.yml).
name: Deploy (Lighthouse Archive)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - real/currents

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Setup Node.js
        uses: ./.github/workflows/node.js

      - name: Setup Quarto
        uses: ./.github/workflows/quarto

      - name: Build with Next.js
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: out

  archive-to-lighthouse:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: out

      - name: Setup Node.js
        uses: ./.github/workflows/node.js

      - name: Upload to Lighthouse (Perpetual Storage)
        id: lighthouse
        env:
          LIGHTHOUSE_API_KEY: ${{ secrets.LIGHTHOUSE_API_KEY }}
        run: |
          npm ci
          RESPONSE=$(LIGHTHOUSE_API_KEY="$LIGHTHOUSE_API_KEY" node scripts/lighthouse-upload.mjs ./out)
          HASH=$(echo "$RESPONSE" | node -e "const d=require('fs').readFileSync(0,'utf8'); try { const j=JSON.parse(d); console.log(j.hash||''); } catch(e) { console.log(''); }")
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Lighthouse CID: $HASH"

      - name: Update Sovereign IPNS Pointer
        if: steps.lighthouse.outputs.hash != ''
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          CID: ${{ steps.lighthouse.outputs.hash }}
        run: |
          if [ -n "$CID" ] && [ -n "$DEPLOY_SECRET" ]; then
            curl -sS -X POST https://www.real-currents.com/api/ipns/publish \
              -H "x-api-key: $DEPLOY_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"key\": \"xr-baseline-0\", \"cid\": \"$CID\"}" || true
          fi
